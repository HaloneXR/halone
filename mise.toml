[tools]
java = "17"
node = "24"
pnpm = "10.33.2"

[tasks.setup]
description = "Install and build the SDK, then install web dependencies"
run = ["git submodule update --init --recursive", "pnpm --dir sdk install --frozen-lockfile", "pnpm --dir sdk build", "pnpm --dir web install --frozen-lockfile"]

[tasks.dev]
description = "Start the desktop simulator and system apps"
run = "pnpm --dir web dev"

[tasks."web:check"]
description = "Run web tests and type checks"
run = ["pnpm --dir web test", "pnpm --dir web typecheck"]

[tasks."web:build"]
run = "pnpm --dir web build"

[tasks."android:test"]
run = "./gradlew test"

[tasks."android:build"]
depends = ["web:build"]
run = "./gradlew :app:assembleDebug"

[tasks."glasses:test"]
description = "Run device driver and tracking unit tests"
run = "./gradlew :core-glasses:test"

[tasks."desktop:build"]
description = "Build the desktop compositor and glasses tool, without the Android modules"
run = "./gradlew -Phalone.desktopOnly :desktop-glasses:installDist :desktop-compositor:installDist"

[tasks.desktop]
description = "Run the desktop version in a window; extra arguments go to it"
depends = ["desktop:build"]
run = "desktop/compositor/build/install/halone-desktop/bin/halone-desktop"

[tasks."desktop:glasses"]
description = "Run the desktop version on attached glasses; extra arguments go to it"
depends = ["desktop:build"]
run = "desktop/compositor/build/install/halone-desktop/bin/halone-desktop --glasses"

[tasks."glasses:probe"]
description = "List HID devices, or track attached glasses: mise run glasses:probe track 30"
depends = ["desktop:build"]
run = "desktop/glasses/build/install/glasses-probe/bin/glasses-probe"
