name: Release

on:
  push:
    tags: ['*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: gradle/actions/setup-gradle@v6

      - name: Build the system apps
        working-directory: web
        run: |
          pnpm sdk
          pnpm install --frozen-lockfile
          pnpm build

      - name: Decode the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the APKs
        env:
          ORG_GRADLE_PROJECT_haloneKeystore: ${{ runner.temp }}/release.jks
          ORG_GRADLE_PROJECT_haloneKeystorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_haloneKeyAlias: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_haloneKeyPassword: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -Phalone.date="${GITHUB_REF_NAME%%-*}"

      - name: Name the APKs after the release
        run: |
          mkdir dist
          for abi in arm64-v8a x86_64; do
            cp "android/app/build/outputs/apk/release/app-$abi-release.apk" "dist/Halone-$GITHUB_REF_NAME-$abi.apk"
          done

      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.apk --verify-tag --generate-notes --prerelease
          fi
